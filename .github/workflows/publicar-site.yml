# Publica o site da ROTA no Cloudflare Pages a cada push para `main`:
#   /       página de apresentação (pasta site/)
#   /app/   a app Flutter compilada para web, ligada ao mesmo Supabase
#
# Segredos (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
# Variáveis (mesmo sítio → Variables):
#   CONTACTO_EMAIL    obrigatória: email da política de privacidade
#   CLOUDFLARE_PROJETO opcional, por omissão "rota"
#   ENDERECO_SITE      opcional, por omissão https://<projeto>.pages.dev
#                      (muda-a quando ligares um domínio próprio)

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Duas publicações seguidas: a mais recente ganha, a anterior é cancelada.
concurrency:
  group: publicar-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJETO: ${{ vars.CLOUDFLARE_PROJETO || 'rota' }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar configuração
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACTO_EMAIL: ${{ vars.CONTACTO_EMAIL }}
        run: |
          falta=0
          for nome in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTACTO_EMAIL; do
            if [ -z "${!nome}" ]; then
              echo "::error::Falta $nome nas definições do repositório (Settings → Secrets and variables → Actions)."
              falta=1
            fi
          done
          exit $falta

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Criar env/prod.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg chave "$SUPABASE_PUBLISHABLE_KEY" \
            '{AMBIENTE: "prod", SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $chave}' \
            > env/prod.json

      - name: Compilar a app para web
        run: |
          flutter pub get
          flutter build web --release --base-href /app/ \
            --dart-define-from-file=env/prod.json

      - name: Juntar página de apresentação e app
        env:
          ENDERECO_SITE: ${{ vars.ENDERECO_SITE }}
          CONTACTO_EMAIL: ${{ vars.CONTACTO_EMAIL }}
        run: |
          endereco="${ENDERECO_SITE:-https://$PROJETO.pages.dev}"
          endereco="${endereco%/}"
          mkdir -p dist
          cp -r site/. dist/
          cp -r build/web dist/app
          find dist -maxdepth 1 -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) \
            -exec sed -i \
              -e "s|__ENDERECO_SITE__|$endereco|g" \
              -e "s|__CONTACTO__|$CONTACTO_EMAIL|g" {} +
          if grep -rl '__ENDERECO_SITE__\|__CONTACTO__' dist --include='*.html' --include='*.xml' --include='*.txt'; then
            echo "::error::Ficaram marcadores por substituir nos ficheiros acima."
            exit 1
          fi
          echo "Site: $endereco"

      # Só tem efeito na primeira vez; depois falha por o projeto já existir.
      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJETO }} --production-branch=main

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJETO }} --branch=main --commit-dirty=true
