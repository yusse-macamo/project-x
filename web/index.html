<!DOCTYPE html>
<html lang="pt">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ROTA — pede mota, txopela ou táxi em Inhambane, Maxixe e Vilankulos.">
  <meta name="theme-color" content="#141B3D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ROTA">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ROTA — Pedir viagem</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #141B3D; }
    #a-carregar {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #FFF6EA;
    }
    #a-carregar strong { font-size: 40px; letter-spacing: 6px; color: #F5A81C; }
    #a-carregar span { font-size: 15px; opacity: .8; }
  </style>
</head>
<body>
  <div id="a-carregar"><strong>ROTA</strong><span>A abrir…</span></div>
  <noscript>Para usar a ROTA no browser, ativa o JavaScript.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('a-carregar');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
